<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI State Space Visualizers</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      background: #20242a;
      color: #f7efe1;
      font-family: Arial, Helvetica, sans-serif;
    }

    .switcher {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px max(14px, 3vw);
      border-bottom: 1px solid rgba(247, 239, 225, 0.16);
      background: #20242a;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
    }

    .brand {
      min-width: 0;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .tab {
      min-height: 40px;
      border: 1px solid rgba(247, 239, 225, 0.28);
      border-radius: 8px;
      background: #303841;
      color: #f7efe1;
      font: inherit;
      font-weight: 700;
      padding: 0 14px;
      cursor: pointer;
    }

    .tab:hover {
      background: #3c4652;
    }

    .tab.active {
      border-color: #ffe08a;
      background: #4f3e19;
      color: #fff2b8;
    }

    .viewer {
      display: none;
      width: 100%;
      height: calc(100vh - 61px);
      border: 0;
      background: #ffffff;
    }

    .viewer.active {
      display: block;
    }

    @media (max-width: 620px) {
      .switcher {
        align-items: stretch;
        flex-direction: column;
      }

      .brand {
        white-space: normal;
      }

      .tabs {
        justify-content: stretch;
      }

      .tab {
        flex: 1 1 150px;
      }

      .viewer {
        height: calc(100vh - 112px);
      }
    }
  </style>
</head>
<body>
  <nav class="switcher" aria-label="Visualizer switcher">
    <div class="brand">AI State Space Visualizers</div>
    <div class="tabs" role="tablist" aria-label="Choose a visualizer">
      <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="queenFrame" data-target="queen">4 Queen Visual</button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="hanoiFrame" data-target="hanoi">Hanoi Visual</button>
    </div>
  </nav>

  <iframe class="viewer active" id="queenFrame" src="4_queen_visual_logic.html" title="Interactive 4 Queen Logic"></iframe>
  <iframe class="viewer" id="hanoiFrame" src="hanoi_visualizer.html" title="Tower of Hanoi Visualizer"></iframe>

  <script>
    const tabs = Array.from(document.querySelectorAll(".tab"));
    const frames = {
      queen: document.getElementById("queenFrame"),
      hanoi: document.getElementById("hanoiFrame")
    };

    function showVisualizer(target) {
      const selected = frames[target] ? target : "queen";

      tabs.forEach((tab) => {
        const isActive = tab.dataset.target === selected;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      });

      Object.entries(frames).forEach(([name, frame]) => {
        frame.classList.toggle("active", name === selected);
      });

      document.title = selected === "hanoi"
        ? "Tower of Hanoi Visualizer"
        : "Interactive 4 Queen Logic";
      history.replaceState(null, "", `#${selected}`);
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => showVisualizer(tab.dataset.target));
    });

    showVisualizer(location.hash.replace("#", ""));
  </script>
</body>
</html>
